# Installed as an envsubst template (Dockerfile): ${NGINX_LOCAL_RESOLVERS} becomes the pod's
# nameservers from /etc/resolv.conf at container start, and ${DANDI_INSTANCE} the DANDI instance
# in use, from the container's environment. Other $names are nginx variables.

# The instance's API (src/core/dandiInstances.ts; a test checks they agree).
map "${DANDI_INSTANCE}" $dandi_api_origin {
  default "";
  "dandi" https://api.dandiarchive.org;
  "dandi-sandbox" https://api.sandbox.dandiarchive.org;
  "ember-dandi" https://api-dandi.emberarchive.org;
  "ember-dandi-sandbox" https://api-dandi.sandbox.emberarchive.org;
}

server {
  listen 8080;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # EMBER's POST /oauth/token/ reply has no CORS header, so the browser can't read the login token
  # from it directly; through this same-origin proxy it can. (File bytes go straight to S3, not here.)
  # Only what the app calls: the token exchange and the REST API. Anything else under it is refused.
  # The upstream is a variable so nginx resolves EMBER per request (honouring the DNS TTL) instead of
  # once at startup: a failed lookup then only breaks EMBER calls, not nginx starting, and EMBER's IPs
  # can change under us. A variable proxy_pass doesn't strip the location prefix, hence the rewrite.
  resolver ${NGINX_LOCAL_RESOLVERS} ipv6=off;
  resolver_timeout 5s;
  # proxy_pass sends the instance's host as Host. An unknown DANDI_INSTANCE leaves it empty: refused.
  set $dandi_api $dandi_api_origin;

  location /ember-proxy/oauth/token/ {
    if ($dandi_api = "") { return 500 "DANDI_INSTANCE is not a known DANDI instance"; }
    rewrite ^/ember-proxy(/.*)$ $1 break;
    proxy_pass $dandi_api;
    proxy_ssl_server_name on;
  }
  location /ember-proxy/api/ {
    if ($dandi_api = "") { return 500 "DANDI_INSTANCE is not a known DANDI instance"; }
    rewrite ^/ember-proxy(/.*)$ $1 break;
    proxy_pass $dandi_api;
    proxy_ssl_server_name on;
  }
  location /ember-proxy/ {
    return 404;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public";
  }
}
